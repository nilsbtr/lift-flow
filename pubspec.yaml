name: lift_flow
description: "Lift Flow - a fully local, minimal gym tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  collection: ^1.19.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  dynamic_color: ^2.1.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.0.1
  home_widget: ^0.10.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  material_ui: ^1.4.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  quick_actions: ^1.1.1
  timezone: ^0.11.1
  vector_graphics: ^1.2.3
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  vector_graphics_compiler: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Quicksand-OFL.txt
    - assets/fonts/NunitoSans-OFL.txt
    # Compiled to vector_graphics binaries at build time.
    - path: assets/icons/
      transformers:
        - package: vector_graphics_compiler
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NunitoSans-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: assets/icon/adaptive-icon.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: "#1E3A8A"
